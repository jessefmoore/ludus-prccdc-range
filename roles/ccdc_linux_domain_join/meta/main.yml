---
galaxy_info:
  role_name: ccdc_linux_domain_join
  namespace: ccdc
  author: ccdc
  description: >-
    Join a Debian/Ubuntu Linux host to the CCDC Active Directory domain
    (prccdc.local) using realmd, SSSD and adcli so AD users can authenticate
    via SSH/console. Configures DNS to the DC, SSSD, PAM home-dir creation,
    and sudo for AD groups. Idempotent and safe to re-run.
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
  galaxy_tags:
    - activedirectory
    - realmd
    - sssd
    - domain
    - linux
    - ccdc
dependencies: []

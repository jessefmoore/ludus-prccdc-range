---
# Port Squid listens on for client HTTP proxy requests.
ludus_squid_port: 3128

# Client subnets permitted to use the proxy. Requests from outside these
# CIDRs are denied. Defaults cover the RFC1918 private ranges used by ranges.
ludus_squid_allowed_cidrs:
  - "10.0.0.0/8"
  - "192.168.0.0/16"
  - "172.16.0.0/12"

# Optional domain blocklist. Any dstdomain matching an entry is denied,
# letting instructors blocklist sites. Example: ['.example.com', 'ads.bad.tld']
ludus_squid_blocked_domains: []

# visible_hostname reported by Squid (also used in error pages).
ludus_squid_visible_hostname: "ccdc-proxy"

---
# ccdc_pii role defaults. Every value is overridable via Ludus role_vars.
# All generated data is SYNTHETIC test data (see README.md).

# ---------------------------------------------------------------------------
# Target directories on the Windows VM where the planted files are dropped.
# ---------------------------------------------------------------------------
ccdc_pii_data_dir: 'C:\CCDC-Data'
ccdc_pii_desktop_dir: 'C:\Users\Public\Desktop\Sensitive'
ccdc_pii_hr_dir: 'C:\Users\Public\Documents\HR'

# ---------------------------------------------------------------------------
# Row counts per generated file (overridable to make the target smaller/bigger).
# ---------------------------------------------------------------------------
ccdc_pii_customer_cards_rows: 25
ccdc_pii_employees_rows: 20
ccdc_pii_passwords_rows: 15
ccdc_pii_bank_accounts_rows: 15

# First line stamped into every generated file so it is unmistakably fake.
ccdc_pii_header: "SYNTHETIC TEST DATA - CCDC COMPETITION - NOT REAL"

# ---------------------------------------------------------------------------
# Publicly-known TEST credit card numbers (PANs). These are the standard test
# card numbers published by the card networks / payment processors for QA use.
# They are NOT real cards and cannot be charged.
# ---------------------------------------------------------------------------
ccdc_pii_test_cards:
